packages:
  - apps/*
  - packages/*

# pnpm 10 bloque les scripts d'installation par défaut : n'autoriser que ceux
# dont on a réellement besoin (ex. argon2, prisma) en les listant ici.
onlyBuiltDependencies:
  - '@prisma/engines'
  - argon2
  - esbuild
  - prisma

# Alertes sans version corrigée, limitées à l'outillage de build d'Expo (jamais embarqué dans
# l'app ni dans les images) : node-forge via @expo/cli (certificats HTTPS de dev), braces via
# metro-file-map, zod 3 via @expo/cli (corrigé seulement en 4.6.6 ; notre zod direct est en
# 4.x corrigé). À retirer dès qu'un correctif est publié.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-mrhx-c7xc-m3w5
