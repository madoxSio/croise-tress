# Application iOS : build signé par EAS Build (serveurs macOS d'Expo) puis envoi automatique
# sur TestFlight par EAS Submit. Déclenché par un tag mobile-vX.Y.Z ou à la main.
# Prérequis (une seule fois) : apps/mobile/eas.json, projet EAS lié, identifiants Apple et clé
# App Store Connect enregistrés sur EAS. Guide : docs/deploy/IOS-TESTFLIGHT.md.
name: Mobile

on:
  push:
    tags: ['mobile-v*.*.*']
  workflow_dispatch:
    inputs:
      profile:
        description: Profil EAS (production → TestFlight ; preview → distribution interne)
        type: choice
        options: [production, preview]
        default: production
      platform:
        description: Plateforme
        type: choice
        options: [ios, android, all]
        default: ios

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Mêmes contrôles que le reste du monorepo : aucun build n'est envoyé si un test échoue.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: mobile-release
    env:
      PROFILE: ${{ inputs.profile || 'production' }}
      PLATFORM: ${{ inputs.platform || 'ios' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Vérifier les prérequis
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::secret EXPO_TOKEN manquant"; exit 1; }
          test -f apps/mobile/eas.json || { echo "::error::apps/mobile/eas.json absent"; exit 1; }
          grep -q '"projectId"' apps/mobile/app.json || { echo "::error::projet EAS non lié : lancer eas init (docs/deploy/IOS-TESTFLIGHT.md)"; exit 1; }
          if [ "$PROFILE" = production ] && grep -q REMPLIR_APPLE_ID_NUMERIQUE apps/mobile/eas.json; then
            echo "::error::ascAppId à remplir dans apps/mobile/eas.json"; exit 1
          fi
      - run: pnpm install --frozen-lockfile --filter @crossverse/mobile...
      - uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # v9
        with:
          eas-version: 24.10.0
          packager: pnpm
          token: ${{ secrets.EXPO_TOKEN }}
      # --no-wait : le build tourne chez Expo (20 à 40 min) sans consommer de minutes GitHub ;
      # Expo notifie par e-mail, et le build iOS part ensuite seul sur TestFlight.
      - name: Lancer EAS Build
        working-directory: apps/mobile
        run: |
          submit=""
          # Envoi automatique sur TestFlight ; Google Play demandera sa propre clé de service.
          if [ "$PROFILE" = production ] && [ "$PLATFORM" = ios ]; then submit="--auto-submit"; fi
          eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait $submit
