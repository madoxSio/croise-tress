# Création d'un compte confirmé (administrateur ou compte de test) sur la base de production,
# sans environnement local : Actions → « Compte (production) » → Run workflow.
#
# Prérequis (une seule fois) : secret PROD_DATABASE_URL = chaîne de connexion de la base de
# production (Neon en provisoire). Mot de passe :
# - secret ACCOUNT_PASSWORD défini → utilisé tel quel (12 caractères minimum) ;
# - sinon → mot de passe aléatoire jamais affiché, puis e-mail « mot de passe oublié » envoyé
#   par l'API (variable API_PUBLIC_URL) : on choisit son mot de passe via le lien reçu.
# Le dépôt est public : rien de secret ne doit apparaître dans les journaux de ce workflow.
name: Compte (production)

on:
  workflow_dispatch:
    inputs:
      email:
        description: Adresse e-mail du compte
        required: true
        type: string
      username:
        description: Pseudo (3 à 24 caractères, lettres sans accent, chiffres, _ ou -)
        required: true
        type: string
      admin:
        description: Donner le rôle administrateur
        required: false
        type: boolean
        default: false
      existing:
        description: Compte déjà existant → seulement changer son rôle (admin coché = promouvoir, sinon retirer)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: account-production
  cancel-in-progress: false

jobs:
  account:
    # Seulement depuis main, et par quelqu'un qui a les droits d'écriture (workflow_dispatch).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      # Exigée par la validation de configuration ; sans effet pour le script.
      WEB_ORIGINS: http://localhost
      EMAIL: ${{ inputs.email }}
      USERNAME: ${{ inputs.username }}
      ADMIN: ${{ inputs.admin }}
      EXISTING: ${{ inputs.existing }}
    steps:
      - name: Vérifier les prérequis
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret PROD_DATABASE_URL absent (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @crossverse/api...
      - run: pnpm --filter @crossverse/api db:generate
      # La table audit_log doit exister : migrations versionnées, idempotentes (déjà faites par
      # l'API au démarrage si la dernière version est déployée).
      - run: pnpm --filter @crossverse/api exec prisma migrate deploy

      - name: Changer le rôle d'un compte existant
        if: inputs.existing
        working-directory: apps/api
        run: |
          if [ "$ADMIN" = "true" ]; then command=promote; else command=demote; fi
          pnpm exec tsx scripts/account.ts "$command" --email "$EMAIL"

      - name: Créer le compte
        if: ${{ !inputs.existing }}
        id: create
        working-directory: apps/api
        env:
          PROVIDED_PASSWORD: ${{ secrets.ACCOUNT_PASSWORD }}
        run: |
          if [ -n "$PROVIDED_PASSWORD" ]; then
            export ACCOUNT_PASSWORD="$PROVIDED_PASSWORD"
            echo "reset=false" >> "$GITHUB_OUTPUT"
          else
            # Aléatoire, masqué dans les journaux et jamais communiqué : le titulaire choisit le
            # sien par l'e-mail de réinitialisation envoyé à l'étape suivante.
            ACCOUNT_PASSWORD="$(openssl rand -base64 24)"
            echo "::add-mask::$ACCOUNT_PASSWORD"
            export ACCOUNT_PASSWORD
            echo "reset=true" >> "$GITHUB_OUTPUT"
          fi
          args=(create --email "$EMAIL" --username "$USERNAME")
          if [ "$ADMIN" = "true" ]; then args+=(--admin); fi
          pnpm exec tsx scripts/account.ts "${args[@]}"

      - name: Envoyer l'e-mail de choix du mot de passe
        if: steps.create.outputs.reset == 'true'
        env:
          API: ${{ vars.API_PUBLIC_URL }}
        run: |
          if [ -z "$API" ]; then
            echo "::warning::Variable API_PUBLIC_URL absente : utilisez « Mot de passe oublié » sur le site."
            exit 0
          fi
          # En-tête client natif : pas d'Origin navigateur ici (cf. apps/api/src/plugins/auth.ts).
          body="$(jq -cn --arg email "$EMAIL" '{email: $email}')"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST "${API%/}/api/v1/auth/password/forgot" \
            -H 'content-type: application/json' -H 'x-crossverse-client: native' --data "$body")"
          if [ "$status" = "202" ] || [ "$status" = "200" ]; then
            echo "E-mail de réinitialisation demandé ($status) : ouvrir le lien reçu pour choisir le mot de passe."
          else
            echo "::warning::Réponse $status de l'API : utilisez « Mot de passe oublié » sur le site."
          fi
